; AmnesiaTDD.FPSFix configuration
; Keep this file beside AmnesiaTDD.FPSFix.asi.

[General]
Enabled = true
Diagnostics = true

[Telemetry]
; Periodic diagnostics are useful when reporting a problem. MotionTrace remains
; off because it is a much heavier per-frame diagnostic.
Enabled = true
; Opt-in per-frame camera-pose CSV for controlled diagnostics. Leave disabled
; during normal play and release validation unless investigating camera motion.
MotionTrace = false
ReportIntervalSeconds = 5

; RenderUnlock removes only HPL2's presentation gate. Simulation remains on
; the original fixed-step timer. Use VSync or an external cap for this build.
[Features]
RenderUnlock = true
PresentationLimiter = false
CameraInterpolation = true
HandsRootInterpolation = true
; Dynamic props, drawers, doors, furniture, cloth, enemies, and ragdolls.
WorldRootInterpolation = true
; First-person hands, held items, and lantern animation/sway.
HandsPoseInterpolation = true
; Skeletal animation for supported world entities such as Grunts.
WorldPoseInterpolation = true
; Active ragdoll body poses. Sleeping bodies remain off the render hot path.
RagdollPoseInterpolation = true
; Render-only interpolation between HPL's built-in previous/current particle
; positions. Particle simulation, collision, emission, and lifetime stay at 60 Hz.
ParticleInterpolation = true
; Correct HPL2's image-trail accumulation so startled/sanity afterimages retain
; the original 60 Hz decay time instead of becoming stronger at high frame rates.
ImageTrailTiming = true
; Presentation-rate raw mouse look and software cursors. Special camera modes
; remain engine-owned and transition back to raw input without retained state.
MouseOverlay = true

[Timing]
; 0 means uncapped. This setting has no effect until PresentationLimiter exists.
TargetFPS = 0
